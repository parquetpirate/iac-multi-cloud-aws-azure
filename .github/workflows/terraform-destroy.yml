name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "DESTROY" to confirm destruction of ALL resources'
        required: true
        default: 'no'

env:
  AWS_REGION: us-east-2
  ROLE_ARN: arn:aws:iam::463032375612:role/github-actions-terraform-role

jobs:
  terraform-destroy:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'DESTROY'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Azure OIDC Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build Docker image
        run: docker build -t iac-multi-cloud-aws-azure .

      - name: Terraform Init
        run: >
          ARM_OIDC_TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r '.value')
          && docker run --rm
          -v $PWD/IaC:/iac
          -e AWS_ACCESS_KEY_ID=${{ env.AWS_ACCESS_KEY_ID }}
          -e AWS_SECRET_ACCESS_KEY=${{ env.AWS_SECRET_ACCESS_KEY }}
          -e AWS_SESSION_TOKEN=${{ env.AWS_SESSION_TOKEN }}
          -e AWS_DEFAULT_REGION=${{ env.AWS_REGION }}
          -e ARM_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }}
          -e ARM_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}
          -e ARM_SUBSCRIPTION_ID=${{ secrets.AZURE_SUBSCRIPTION_ID }}
          -e ARM_USE_OIDC=true
          -e ARM_OIDC_TOKEN=$ARM_OIDC_TOKEN
          iac-multi-cloud-aws-azure
          bash -c "cd /iac && terraform init"

      - name: Terraform Destroy
        run: >
          ARM_OIDC_TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r '.value')
          && docker run --rm
          -v $PWD/IaC:/iac
          -e AWS_ACCESS_KEY_ID=${{ env.AWS_ACCESS_KEY_ID }}
          -e AWS_SECRET_ACCESS_KEY=${{ env.AWS_SECRET_ACCESS_KEY }}
          -e AWS_SESSION_TOKEN=${{ env.AWS_SESSION_TOKEN }}
          -e AWS_DEFAULT_REGION=${{ env.AWS_REGION }}
          -e ARM_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }}
          -e ARM_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}
          -e ARM_SUBSCRIPTION_ID=${{ secrets.AZURE_SUBSCRIPTION_ID }}
          -e ARM_USE_OIDC=true
          -e ARM_OIDC_TOKEN=$ARM_OIDC_TOKEN
          iac-multi-cloud-aws-azure
          bash -c "cd /iac && terraform destroy -auto-approve"
